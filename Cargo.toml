[package]
name = "neuromamba_trainer_lab"
version = "0.1.0"
edition = "2021"
description = "CPU-first pure-Rust supervised trainer for Selective State Space Models with Hyperspherical Prototype Networks."
authors = ["NeuroMamba Contributors"]
license = "Apache-2.0"
repository = "https://github.com/YOUR_ORG/neuromamba_trainer_lab"
homepage = "https://github.com/YOUR_ORG/neuromamba_trainer_lab"
documentation = "https://docs.rs/neuromamba_trainer_lab"
readme = "README.md"
keywords = ["mamba", "ssm", "trainer", "cpu", "hpn"]
categories = ["machine-learning", "science", "algorithms"]
exclude = ["runs/", "target/"]

[lib]
name = "neuromamba_trainer_lab"
path = "src/lib.rs"

[dependencies]
ndarray = { version = "0.16", features = ["rayon", "serde"] }
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
wide = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"